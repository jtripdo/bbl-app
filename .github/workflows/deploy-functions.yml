name: Deploy kitchen display functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function packages
        working-directory: functions
        run: npm install

      - name: Write settings file from secrets
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
          SQUARE_WEBHOOK_URL: ${{ secrets.SQUARE_WEBHOOK_URL }}
        run: |
          {
            echo "SQUARE_ACCESS_TOKEN=$SQUARE_ACCESS_TOKEN"
            echo "SQUARE_WEBHOOK_SIGNATURE_KEY=$SQUARE_WEBHOOK_SIGNATURE_KEY"
            echo "SQUARE_WEBHOOK_URL=$SQUARE_WEBHOOK_URL"
          } > functions/.env

      - name: Check which secrets are set
        env:
          A: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          B: ${{ secrets.FIREBASE_PROJECT_ID }}
          C: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          D: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
          E: ${{ secrets.SQUARE_WEBHOOK_URL }}
        run: |
          for pair in "FIREBASE_SERVICE_ACCOUNT:$A" "FIREBASE_PROJECT_ID:$B" "SQUARE_ACCESS_TOKEN:$C" "SQUARE_WEBHOOK_SIGNATURE_KEY:$D" "SQUARE_WEBHOOK_URL:$E"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ -n "$val" ]; then echo "SECRET $name: set"; else echo "SECRET $name: MISSING"; fi
          done

      - name: Sign in to Google
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync(process.argv[1], "utf8");
            console.log("Key length:", raw.length, "characters");
            if (!raw.trim()) { console.error("::error::FIREBASE_SERVICE_ACCOUNT secret is empty"); process.exit(1); }
            if (/[“”‘’]/.test(raw)) console.error("::warning::Key contains curly quotes (iPhone smart punctuation)");
            let k;
            try { k = JSON.parse(raw); } catch (e) { console.error("::error::Key is not valid JSON (" + e.message + "). Starts with: " + JSON.stringify(raw.slice(0, 12)) + " ends with: " + JSON.stringify(raw.slice(-12))); process.exit(1); }
            const missing = ["type", "project_id", "private_key", "client_email"].filter((f) => !k[f]);
            if (missing.length) { console.error("::error::Key is missing: " + missing.join(", ")); process.exit(1); }
            console.log("Key OK. type:", k.type, "| project:", k.project_id, "| account:", k.client_email);
          ' "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@latest deploy --only functions --project "$PROJECT_ID" --non-interactive --force

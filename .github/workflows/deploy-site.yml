name: Deploy website
on:
  push:
    branches: [main]
    paths-ignore: ['functions/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build site folder
        run: |
          mkdir _site
          find . -maxdepth 1 -type f ! -name '.*' ! -name '*.md' ! -name 'firebase.json' -exec cp {} _site/ \;
          node .github/scripts/stamp.js _site "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: dep
        uses: actions/deploy-pages@v4

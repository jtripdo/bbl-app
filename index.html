<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BBL">
<link rel="apple-touch-icon" href="logo.png">
<title>Buttermilk Biscuit Lab</title>
<style>
:root{--bg:#faf8f4;--ink:#141414;--mut:#6f6a62;--line:#e4dfd5;--acc:#b5651d;--ok:#2e7d32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px 40px}
#app{max-width:520px;margin:0 auto}
.logo{display:block;margin:12px auto 0;width:150px;max-width:50%}
.brand{display:none;text-align:center;font-size:24px;font-weight:800;margin:20px 0 0}
#bar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);margin:6px 0 14px;min-height:30px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.full{width:100%;margin:18px 0}
.btn.sm{padding:8px 14px;font-size:14px;margin-top:8px}
.link{background:none;border:0;color:var(--acc);text-decoration:underline;padding:4px 2px;font-size:13px}
.back{background:none;border:0;font-size:16px;color:var(--ink);padding:8px 0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.top h2{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;min-height:100px;font-size:16px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile span{font-size:28px}
.big{width:100%;background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:22px;font-size:20px;font-weight:700;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.dim{color:var(--mut)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #cfc9bd;border-radius:10px;background:#fff;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two.kt{grid-template-columns:110px 1fr}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;min-height:60px}
.chk{width:32px;height:32px;border:2px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done .txt{color:var(--mut)}
.txt{flex:1;font-size:17px}
.who{font-size:12px;color:var(--mut);margin-top:2px}
.x{background:none;border:0;color:#b0a99c;font-size:18px;padding:8px}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{margin-bottom:0}
.mut{color:var(--mut)}.small{font-size:13px}.center{text-align:center}
.sec{margin:20px 0 8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.add summary{font-weight:700;padding:14px;background:#fff;border:1px dashed #9b9488;border-radius:12px;list-style:none;text-align:center;margin:12px 0}
.ih{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.oh{display:flex;align-items:center;gap:10px}
.oh label{white-space:nowrap}
.oh input{margin:0;text-align:right}
.need{margin-top:8px;font-size:16px;color:var(--acc)}
.msgs{height:55vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.msg{background:#f1ede4;border-radius:12px;padding:8px 12px;margin-bottom:8px;max-width:85%;word-wrap:break-word}
.msg.me{background:var(--ink);color:#fff;margin-left:auto}
.mh{font-size:11px;opacity:.7;margin-bottom:2px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;color:#fff;background:var(--acc)}
.tag.want{background:#555}
.today{background:var(--ok)}
.hl{font-size:14px;padding:3px 0;border-top:1px solid var(--line)}
summary{cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <img class="logo" src="logo.png" alt="Buttermilk Biscuit Lab" onerror="this.style.display='none';document.getElementById('brand').style.display='block'">
  <div id="brand" class="brand">Buttermilk Biscuit Lab</div>
  <div id="bar"></div>
  <div id="view"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCV4nlJD5Uq6pS-P_sabpzHUjgi2kf_6Uk",
  authDomain:"bbl-app-d58e6.firebaseapp.com",
  projectId:"bbl-app-d58e6",
  storageBucket:"bbl-app-d58e6.firebasestorage.app",
  messagingSenderId:"159270496914",
  appId:"1:159270496914:web:8076c4dda73557bc2f544b"
};
const app=initializeApp(firebaseConfig);
let db;
try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}
catch(e){db=getFirestore(app);}

// ===== TEAM NAMES (edit this line to add or remove people) =====
const TEAM=["Joe D.","Noel C.","Bernard S."];
// ================================================================

let me=null;try{me=localStorage.getItem('bblName');}catch(e){}
if(me&&!TEAM.includes(me))me=null;
let subs=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sub=u=>subs.push(u);
const clearSubs=()=>{subs.forEach(u=>u());subs=[];};
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());
const fmt=ts=>{const d=ts&&ts.toDate?ts.toDate():new Date();return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});};
const dd=d=>({id:d.id,...d.data({serverTimestamps:'estimate'})});
const dlabel=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});};
const t12=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM');};
const setView=h=>{$('#view').innerHTML=h;window.scrollTo(0,0);};
const topbar=(t,back='dash')=>`<div class="top"><button class="back" data-go="${back}">← Back</button><h2>${esc(t)}</h2></div>`;

function renderBar(){
  $('#bar').innerHTML=me?`<span>Working as <b>${esc(me)}</b></span><button class="link" data-go="who">Switch</button>`:'';
}
function go(v,arg,title){
  clearSubs();
  if(!me&&v!=='who')v='who';
  renderBar();
  const views={
    who:showWho,dash:showDash,par:showPar,parhist:showParHist,
    opening:()=>showList('opening','Opening Checklist',{note:'This list resets every day.'}),
    closing:()=>showList('closing','Closing Checklist',{note:'This list resets every day.'}),
    cleaning:()=>showList('cleaning','Cleaning List',{note:'This list resets every day.'}),
    prep:()=>showList('prep_'+today(),'Prep Sheet',{ph:'Add a prep task (e.g. 4 lb butter, cubed)',note:'This list is just for today. Tomorrow starts fresh.'}),
    chat:showChat,needs:showNeeds,events:showEvents,
    load:()=>showList('load_'+arg,'Load Out: '+(title||'Event'),{key:'event',back:'events',ph:'Add something to load (e.g. 2 hotel pans)'})
  };
  (views[v]||showDash)();
}
document.addEventListener('click',e=>{
  const w=e.target.closest('[data-who]');
  if(w){me=w.dataset.who;try{localStorage.setItem('bblName',me);}catch(x){}go('dash');return;}
  const t=e.target.closest('[data-go]');
  if(t)go(t.dataset.go,t.dataset.arg,t.dataset.title);
});

function showWho(){
  setView(`<h2 class="center">Who's working?</h2>${TEAM.map(n=>`<button class="big" data-who="${esc(n)}">${esc(n)}</button>`).join('')}`);
}

function showDash(){
  const tiles=[['par','📦','Par Sheets'],['opening','☀️','Opening'],['closing','🌙','Closing'],['cleaning','🧽','Cleaning'],['prep','🔪','Prep Sheet'],['chat','💬','Team Chat'],['needs','🛒','Needs & Wants'],['events','📅','Events']];
  setView(`<p class="center mut">${new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}</p><div class="grid">${tiles.map(t=>`<button class="tile" data-go="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`);
}

// ---------- Generic checklist (opening, closing, cleaning, prep, load out) ----------
function showList(scope,title,opt={}){
  const key=opt.key||today();
  const pre=scope+'__'+key+'__';
  setView(topbar(title,opt.back||'dash')+`<div class="mut" id="prog"></div><div id="items"></div><div class="addrow"><input id="nt" placeholder="${esc(opt.ph||'Add an item')}" maxlength="200"><button class="btn" id="ab">Add</button></div>${opt.note?`<p class="mut small">${esc(opt.note)}</p>`:''}`);
  let items=[],checks={};
  const draw=()=>{
    const done=items.filter(i=>checks[i.id]).length;
    $('#prog').textContent=items.length?`${done} of ${items.length} done`:'';
    $('#items').innerHTML=items.length?items.map(i=>{
      const c=checks[i.id];
      return `<div class="row${c?' done':''}" data-t="${i.id}"><div class="chk">${c?'✓':''}</div><div class="txt">${esc(i.text)}${c?`<div class="who">${esc(c.by)} · ${fmt(c.at)}</div>`:''}</div><button class="x" data-rm="${i.id}" aria-label="Remove">✕</button></div>`;
    }).join(''):'<p class="mut center">Nothing here yet. Add the first item below.</p>';
  };
  sub(onSnapshot(query(collection(db,'listItems'),where('scope','==',scope)),s=>{
    items=s.docs.map(dd).filter(i=>i.active!==false).sort((a,b)=>(a.at?.seconds||0)-(b.at?.seconds||0));
    draw();
  }));
  sub(onSnapshot(query(collection(db,'checks'),where('key','==',scope+'|'+key)),s=>{
    checks={};s.docs.map(dd).forEach(c=>{checks[c.itemId]=c;});
    draw();
  }));
  $('#items').onclick=e=>{
    const rm=e.target.closest('[data-rm]');
    if(rm){if(confirm('Remove this item from the list?'))updateDoc(doc(db,'listItems',rm.dataset.rm),{active:false});return;}
    const row=e.target.closest('[data-t]');if(!row)return;
    const id=row.dataset.t,ref=doc(db,'checks',pre+id);
    if(checks[id]){if(confirm('Undo this check?'))deleteDoc(ref);}
    else setDoc(ref,{key:scope+'|'+key,itemId:id,by:me,at:serverTimestamp()});
  };
  const add=()=>{
    const t=$('#nt').value.trim();if(!t)return;$('#nt').value='';
    addDoc(collection(db,'listItems'),{scope,text:t,by:me,at:serverTimestamp(),active:true});
  };
  $('#ab').onclick=add;
  $('#nt').onkeydown=e=>{if(e.key==='Enter')add();};
}

// ---------- Par sheets ----------
function showPar(){
  setView(topbar('Par Sheet')+`<div><button class="btn ghost sm" data-go="parhist">Past sheets</button></div><div id="pb"></div><button class="btn full" id="pSub" style="display:none">Submit Par Sheet</button>
  <details class="add"><summary>+ Add a par item</summary><div>
  <input id="pSec" list="secs" placeholder="Section (e.g. Walk-In)"><datalist id="secs"></datalist>
  <input id="pName" placeholder="Item name" maxlength="100">
  <div class="two"><input id="pUnit" placeholder="Unit (lb, case)" maxlength="20"><input id="pPar" type="number" inputmode="decimal" placeholder="Par level"></div>
  <button class="btn" id="pAdd">Add item</button></div></details>`);
  let items=[];const vals={};
  const needOf=i=>{const v=vals[i.id];if(v===undefined||v===''||isNaN(parseFloat(v)))return null;return Math.max(0,i.par-parseFloat(v));};
  const needTxt=i=>{const n=needOf(i);return n===null?'—':(Math.round(n*100)/100)+' '+i.unit;};
  const draw=()=>{
    const secs={};
    items.forEach(i=>{(secs[i.section]=secs[i.section]||[]).push(i);});
    $('#secs').innerHTML=Object.keys(secs).map(s=>`<option value="${esc(s)}">`).join('');
    $('#pb').innerHTML=items.length?Object.keys(secs).map(s=>`<div class="sec">${esc(s)}</div>`+secs[s].map(i=>`
      <div class="card"><div class="ih"><b>${esc(i.item)}</b><span class="mut small">Par ${i.par} ${esc(i.unit)}</span></div>
      <div class="oh"><label>On hand</label><input type="number" inputmode="decimal" min="0" step="any" data-in="${i.id}" value="${esc(vals[i.id]??'')}"></div>
      <div class="need">Need: <b id="n_${i.id}">${esc(needTxt(i))}</b></div>
      <div><button class="link" data-par="${i.id}">Edit par</button> · <button class="link" data-rmp="${i.id}">Remove</button></div></div>`).join('')).join('')
      :'<p class="mut center">No items yet. Tap "Add a par item" below to start.</p>';
    $('#pSub').style.display=items.length?'block':'none';
  };
  sub(onSnapshot(query(collection(db,'parItems')),s=>{
    items=s.docs.map(dd).filter(i=>i.active!==false).sort((a,b)=>(a.at?.seconds||0)-(b.at?.seconds||0));
    draw();
  }));
  $('#pb').oninput=e=>{
    const t=e.target.closest('[data-in]');if(!t)return;
    vals[t.dataset.in]=t.value;
    const i=items.find(x=>x.id===t.dataset.in);
    if(i)$('#n_'+i.id).textContent=needTxt(i);
  };
  $('#pb').onclick=e=>{
    const ep=e.target.closest('[data-par]'),rp=e.target.closest('[data-rmp]');
    if(ep){const i=items.find(x=>x.id===ep.dataset.par);const v=prompt('New par level for '+i.item+' ('+i.unit+')',i.par);if(v===null)return;const n=parseFloat(v);if(isNaN(n))return;updateDoc(doc(db,'parItems',i.id),{par:n});}
    if(rp){if(confirm('Remove this item from the par sheet?'))updateDoc(doc(db,'parItems',rp.dataset.rmp),{active:false});}
  };
  $('#pAdd').onclick=()=>{
    const section=$('#pSec').value.trim()||'General',item=$('#pName').value.trim(),unit=$('#pUnit').value.trim(),par=parseFloat($('#pPar').value);
    if(!item||!unit||isNaN(par)){alert('Please fill in the item name, unit, and par level.');return;}
    addDoc(collection(db,'parItems'),{section,item,unit,par,by:me,at:serverTimestamp(),active:true});
    ['pName','pUnit','pPar'].forEach(i=>$('#'+i).value='');
  };
  $('#pSub').onclick=()=>{
    const entries=items.map(i=>{
      const v=vals[i.id];const has=v!==undefined&&v!==''&&!isNaN(parseFloat(v));
      const oh=has?parseFloat(v):null;
      return {item:i.item,section:i.section,unit:i.unit,par:i.par,onHand:oh,need:has?Math.max(0,i.par-oh):null};
    });
    const miss=entries.filter(x=>x.onHand===null).length;
    if(miss&&!confirm(miss+' item(s) have no count entered. Submit anyway?'))return;
    addDoc(collection(db,'parSheets'),{by:me,at:serverTimestamp(),entries}).catch(()=>alert('Could not save the par sheet. Please try again.'));
    setView(topbar('Par Sheet')+`<div class="center"><h2>✅ Submitted</h2><p class="mut">Saved under ${esc(me)}.</p><button class="btn" data-go="dash">Back to home</button> <button class="btn ghost" data-go="parhist">Past sheets</button></div>`);
  };
}
function showParHist(){
  setView(topbar('Past Par Sheets','par')+'<div id="h"></div>');
  sub(onSnapshot(query(collection(db,'parSheets'),orderBy('at','desc'),limit(20)),s=>{
    const rows=s.docs.map(dd);
    $('#h').innerHTML=rows.length?rows.map(r=>`<details class="card"><summary><b>${esc(r.by)}</b> · ${fmt(r.at)}</summary>${(r.entries||[]).map(e=>`<div class="hl">${esc(e.item)}: ${e.onHand===null?'not counted':`${e.onHand} / ${e.par} ${esc(e.unit)} → need <b>${e.need}</b>`}</div>`).join('')}</details>`).join(''):'<p class="mut center">No sheets submitted yet.</p>';
  }));
}

// ---------- Team chat ----------
function showChat(){
  setView(topbar('Team Chat')+`<div id="msgs" class="msgs"></div><div class="addrow"><input id="mt" placeholder="Message the team" maxlength="500"><button class="btn" id="ms">Send</button></div>`);
  let first=true;
  sub(onSnapshot(query(collection(db,'chat'),orderBy('at','desc'),limit(100)),s=>{
    const m=s.docs.map(dd).reverse();const box=$('#msgs');
    const stick=box.scrollTop+box.clientHeight>=box.scrollHeight-40;
    box.innerHTML=m.length?m.map(x=>`<div class="msg${x.by===me?' me':''}"><div class="mh">${esc(x.by)} · ${fmt(x.at)}</div><div>${esc(x.text)}</div></div>`).join(''):'<p class="mut center">No messages yet. Say hi!

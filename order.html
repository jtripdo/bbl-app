<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <title>Order online | Buttermilk Biscuit Lab</title>
  <meta name="description" content="Order Buttermilk Biscuit Lab for pickup.">
  <link rel="stylesheet" href="kiosk.css">
  <link rel="stylesheet" href="order.css">
</head>
<body>
  <!-- Pick a location -->
  <section id="stores" class="screen">
    <div class="hero">
      <img id="heroLogo" class="hero-logo" alt="Buttermilk Biscuit Lab">
      <h1>Order for pickup</h1>
      <p class="muted">Choose a location</p>
    </div>
    <main id="storeList" class="panel"><p class="muted center-text">Loading…</p></main>
  </section>

  <!-- Menu -->
  <section id="menu" class="screen hide">
    <header class="top">
      <button id="changeStore" class="ghost">‹</button>
      <div class="store-head">
        <div id="storeName" class="store-name"></div>
        <div id="storeHours" class="muted small"></div>
      </div>
      <img class="logo" id="menuLogo" alt="">
    </header>
    <nav id="cats" class="cats bar-cats"></nav>
    <main id="items" class="items"></main>
    <footer id="cartBar" class="cartbar hide">
      <button id="openCart" class="primary big"></button>
    </footer>
  </section>

  <div id="sheet" class="overlay hide">
    <div class="sheet" id="sheetBody"></div>
  </div>

  <!-- Cart -->
  <section id="cart" class="screen hide">
    <header class="top">
      <button id="backToMenu" class="ghost">‹ Menu</button>
      <h2>Your order</h2>
      <span></span>
    </header>
    <main id="cartLines" class="panel"></main>
    <footer class="cartbar">
      <button id="toCheckout" class="primary big">Checkout</button>
    </footer>
  </section>

  <!-- Checkout -->
  <section id="checkout" class="screen hide">
    <header class="top">
      <button id="backToCart" class="ghost">‹ Back</button>
      <h2>Pickup details</h2>
      <span></span>
    </header>
    <main class="panel">
      <div id="pickupWhere" class="where"></div>
      <label for="pickupTime">Pickup time</label>
      <select id="pickupTime"></select>
      <label for="custName">Name</label>
      <input id="custName" maxlength="30" autocomplete="given-name" placeholder="Your first name">
      <label for="custPhone">Phone</label>
      <input id="custPhone" type="tel" maxlength="16" autocomplete="tel" placeholder="(813) 555-0123">
      <div id="totals" class="totals"></div>
      <p class="muted small">You'll pay on Square's secure checkout page: Apple Pay, Google Pay, Cash App or card. You can add a tip there.</p>
      <p id="payError" class="error"></p>
    </main>
    <footer class="cartbar">
      <button id="payBtn" class="primary big">Continue to payment</button>
    </footer>
  </section>

  <!-- Thank you -->
  <section id="done" class="screen center hide">
    <div class="check">✓</div>
    <h1 id="doneTitle">Thank you!</h1>
    <p id="doneOrder" class="done-num"></p>
    <p id="doneWhen" class="done-when"></p>
    <p id="doneWhere" class="muted"></p>
    <button id="doneBtn" class="primary big narrow">Start a new order</button>
  </section>

  <script type="module" src="order.js"></script>
</body>
</html>
